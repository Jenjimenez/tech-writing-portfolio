<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.home %}{{ site.title | escape }} | Technical writing portfolio{% else %}{{ page.title | escape }} | {{ site.title | escape }}{% endif %}</title>
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:type" content="website">
  {% if site.url != '' %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Jennifer Botia, home"><span class="brand-mark" aria-hidden="true">JB</span><span>{{ site.title | escape }}</span></a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}#writing-samples">Writing samples</a>
        <a href="{{ '/' | relative_url }}#about">About</a>
        {% if site.resume_path != '' %}<a href="{{ site.resume_path | relative_url }}">R&eacute;sum&eacute;</a>{% endif %}
        <a href="{{ '/' | relative_url }}#contact">Contact</a>
      </nav>
    </div>
  </header>
  <main id="main-content" tabindex="-1">{{ content }}</main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>{{ site.title | escape }} <span aria-hidden="true">&middot;</span> Technical writing portfolio</p>
      <a href="{{ '/' | relative_url }}#writing-samples">Explore the writing samples <span aria-hidden="true">&uarr;</span></a>
    </div>
  </footer>
</body>
</html>
