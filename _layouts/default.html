<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} | {% endif %}Jennifer Botia, Technical Writer</title>
  <meta name="description" content="{{ page.description | default: 'Technical writing portfolio of Jennifer Botia, Technical Content Producer at Pluralsight.' }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark" href="{{ '/' | relative_url }}">Jennifer Botia</a>
      <nav aria-label="Main">
        <a href="{{ '/' | relative_url }}#work">Writing samples</a>
        <a href="{{ '/Jennifer_Botia_2026.pdf' | relative_url }}">Resume</a>
        <a href="mailto:jenjimenezxo@gmail.com">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>Jennifer Botia, technical writer and Technical Content Producer.</p>
      <p>
        <a href="mailto:jenjimenezxo@gmail.com">jenjimenezxo@gmail.com</a>
        <a href="https://www.linkedin.com/in/jenniferbotia/">LinkedIn</a>
        <a href="https://github.com/Jenjimenez/tech-writing-portfolio">Source on GitHub</a>

    </div>
  </footer>

</html>
